function setLang(v){lang=v;document.documentElement.lang=v;document.documentElement.dir=(v==='ar')?'rtl':'ltr';document.getElementById('langSel').value=v;
document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.dataset.i);});

function uid(){return 'B'+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*99);}
let DOCS=[],DI=0,UNDO=[],FOCUS={kind:'text',id:null},SELSH={};
function doc(){return DOCS[DI];}
function save(){try{localStorage.setItem('bo_docs',JSON.stringify(DOCS));localStorage.setItem('bo_di',DI);}catch(e){}
document.getElementById('stSaved').textContent='✓ '+t('savedL');updateInfo();}
let saveT=null;function autoSave(){clearTimeout(saveT);saveT=setTimeout(save,700);}
function snap(){try{UNDO.push(JSON.stringify({d:doc(),i:DI}));}catch(e){}if(UNDO.length>30)UNDO.shift();}
function undo(){const s=UNDO.pop();if(!s)return;try{const o=JSON.parse(s);const ix=DOCS.findIndex(d=>d.id===o.d.id);if(ix>=0)DOCS[ix]=o.d;DI=Math.min(o.i,DOCS.length-1);renderAll();save();}catch(e){}}
function blankDoc(){return {id:uid(),title:'Untitled',blocks:[],seq:{sheet:0}};}
function newDoc(){snap();const d=blankDoc();DOCS.unshift(d);DI=0;renderAll();save();}
function renderDocs(){document.getElementById('docList').innerHTML=DOCS.map((d,i)=>`<div class="docitem${i===DI?' on':''}" onclick="goDoc(${i})"><b>${esc(d.title||'Untitled').slice(0,26)}</b><br><small>${d.blocks.length} ${t('blocksL')}</small></div>`).join('');}
function goDoc(i){syncText();DI=Math.max(0,Math.min(i,DOCS.length-1));renderAll();save();}
function renderTmpl(){const T2=[['tmplReport','📊'],['tmplBudget','💰'],['tmplPitch','📽️']];document.getElementById('tmplList').innerHTML=T2.map(x=>`<div class="docitem" onclick="useTmpl('${x[0]}')"><b>${t(x[0])}</b></div>`).join('');}
function mkText(html){return {id:uid(),type:'text',html:html||'<p><br></p>'};}
function mkSheet(){doc().seq.sheet++;const n='Sheet'+doc().seq.sheet;return {id:uid(),type:'sheet',name:n,data:{},sel:{r:1,c:0}};}
function mkChart(){const sh=doc().blocks.find(b=>b.type==='sheet');return {id:uid(),type:'chart',src:sh?sh.id:'',range:'A1:B5',ctype:'bar'};}
function mkSlide(title,bullets){return {id:uid(),type:'slide',title:title||'Slide',bullets:bullets||[],notes:''};}

snap();const d=blankDoc();
if(k==='tmplReport'){d.title=t('tmplReport');
d.blocks.push(mkText('<h2>'+t('tmplReport')+'</h2><p>Summary with live numbers like {{Sheet1!B4}}.</p>'));

d.blocks.push({id:uid(),type:'chart',src:s.id,range:'A2:B3',ctype:'bar'});
d.blocks.push(mkSlide('Results',['Revenue beat plan','Costs controlled']));}
else if(k==='tmplBudget'){d.title=t('tmplBudget');

d.blocks.push(mkText('<p>Budget vs actual. Total budget: {{'+s.name+'!B4}}, actual: {{'+s.name+'!C4}}.</p>'));}
else{d.title=t('tmplPitch');
d.blocks.push(mkSlide('The Problem',['Pain point one','Pain point two']));
d.blocks.push(mkSlide('The Solution',['Our answer','Why now']));d.blocks.push(mkSlide('Ask',['Join us']));}
DOCS.unshift(d);DI=0;renderAll();save();

function buildBlockBar(){document.getElementById('blockbar').innerHTML=`<button onclick="addBlock('text')">${t('addText')}</button><button onclick="addBlock('sheet')">${t('addSheet')}</button><button onclick="addBlock('chart')">${t('addChart')}</button><button onclick="addBlock('slide')">${t('addSlide')}</button>`;}
function addBlock(kind){snap();
let b=kind==='text'?mkText():kind==='sheet'?mkSheet():kind==='chart'?mkChart():mkSlide('New slide',[]);
doc().blocks.push(b);renderAll();save();focusBlock(b.id);}
function delBlock(id){snap();const d=doc();d.blocks=d.blocks.filter(b=>b.id!==id);renderAll();save();}
function moveBlock(id,dir){const d=doc().blocks,i=d.findIndex(b=>b.id===id),j=i+dir;if(i<0||j<0||j>=d.length)return;snap();const [x]=d.splice(i,1);d.splice(j,0,x);renderAll();save();}
function focusBlock(id){FOCUS.id=id;const b=doc().blocks.find(x=>x.id===id);FOCUS.kind=b?b.type:'text';renderCtx();}
function syncText(){document.querySelectorAll('#canvas .txtedit').forEach(el=>{const b=doc().blocks.find(x=>x.id===el.dataset.id);if(b&&b.type==='text'&&b.html!==el.innerHTML){b.html=el.innerHTML;}});}
function cn(c){let s='';c++;do{c--;s=String.fromCharCode(65+(c%26))+s;c=Math.floor(c/26);}while(c>0);return s;}

ctx.strokeStyle='#2a3557';ctx.beginPath();ctx.moveTo(X0,T);ctx.lineTo(X0,Y1);ctx.lineTo(X1,Y1);ctx.stroke();
const n=labels.length,bw=(X1-X0)/Math.max(1,n);
series[0].forEach((v,i)=>{ctx.fillStyle=cols[0];ctx.strokeStyle=cols[0];
if(ty==='bar'){const hh=(v-mn)/((mx-mn)||1)*(Y1-T-8);const x=X0+i*bw+bw*0.2;ctx.fillRect(x,Y1-hh,bw*0.6,hh);}
else{const x=X0+i*bw+bw/2,y=Y1-(v-mn)/((mx-mn)||1)*(Y1-T-8);if(i===0){ctx.beginPath();ctx.moveTo(x,y);}else ctx.lineTo(x,y);ctx.fillRect(x-2,y-2,4,4);}
if(ty==='line')ctx.stroke();});
ctx.fillStyle='#8b98b8';ctx.font='10px sans-serif';
labels.forEach((l,i)=>{if(i%Math.ceil(n/6)===0)ctx.fillText(String(l).slice(0,10),X0+i*bw,H-8);});
}

function updateInfo(){document.getElementById('stInfo').textContent=doc().blocks.length+' '+t('blocksL')+' · '+doc().blocks.filter(b=>b.type==='slide').length+' '+t('slidesL');}
function extractNumbers(tx){
const out=[];const re=/-?\d[\d,]*(?:\.\d+)?/g;let m;
while((m=re.exec(tx))!==null){const v=parseFloat(m[0].replace(/,/g,''));if(!isNaN(v))out.push(v);}
return out;
}
function sentsOf(tx){return (String(tx||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').match(/[^.!?]+[.!?]+["”)]?|\S[^.!?]*$/g)||[]).map(s=>s.trim()).filter(s=>s.length>10);}
function parseOutline(text){
const slides=[];let cur=null;
String(text||'').split('\n').forEach(raw=>{
const line=raw.trim();if(!line)return;
if(line.charAt(0)==='#'){cur={title:line.replace(/^#+\s*/,'')||'Untitled',bullets:[]};slides.push(cur);return;}
const bm=line.match(/^[-*•]\s+(.*)$/);
if(bm){if(!cur){cur={title:'Untitled',bullets:[]};slides.push(cur);}cur.bullets.push(bm[1]);return;}
if(!cur||cur.bullets.length){cur={title:line,bullets:[]};slides.push(cur);}else cur.bullets.push(line);
});
return slides;
}
function suggestLayout(sl){
const n=(sl.bullets||[]).length;
if(sl.img)return 'imageright';
if(n>6)return 'twocol';
if(n===0)return 'section';
if(n===1&&(sl.bullets[0]||'').length<80)return 'quote';
return 'bullets';
}
function expandNotes(sl){
return (sl.bullets||[]).map((b,i)=>(i+1)+'. Say: "'+b+'" — Explain why it matters. Example: ... Takeaway: ...').join('\n');
}
function aiRun(){
const q=document.getElementById('aiIn').value.trim();
const box=document.getElementById('aiOut');
if(!q){box.innerHTML=t('understoodL');return;}
const low=q.toLowerCase();let done=false;let html='';
const needTbl=/(table|tablo|جدول|spreadsheet|sheet)/.test(low);
const needSlides=/(slide|slayt|شريحة|شرائح|presentation|sunum|عرض)/.test(low);
const needSum=/(summar|özet|لخص|ملخص)/.test(low);
const needRep=/(report|rapor|تقرير)/.test(low);
const needChart=/(chart|grafik|رسم|مخطط)/.test(low);
const txtBlocks=doc().blocks.filter(b=>b.type==='text');
const sheets=doc().blocks.filter(b=>b.type==='sheet');
const plainTxt=txtBlocks.map(b=>(b.html||'').replace(/<[^>]*>/g,' ')).join(' ');
if(needTbl){
const nums=extractNumbers(plainTxt).slice(0,24);
if(nums.length>=2){snap();
const s=mkSheet();const cols=Math.min(4,Math.ceil(Math.sqrt(nums.length)));
nums.forEach((v,i)=>{const r=Math.floor(i/cols)+1,c=i%cols;s.data[r+','+c]={v};});
const tr=Math.ceil(nums.length/cols);
s.data[(tr+1)+',0']={v:'Total'};s.data[(tr+1)+',1']={v:null,f:'=SUM(B1:B'+tr+')'};
doc().blocks.push(s);html+=`📊 sheet <b>${s.name}</b> (${nums.length} nums)<br>`;done=true;}
}
if(needSlides){
const ss=sentsOf(plainTxt).slice(0,12);
if(ss.length){snap();
for(let i=0;i<ss.length;i+=4){const chunk=ss.slice(i,i+4);
doc().blocks.push(mkSlide(chunk[0].slice(0,60),chunk.slice(1)));}
html+=`📽️ ${Math.ceil(ss.length/4)} slides<br>`;done=true;}
}
if(needSum){
const ss=sentsOf(plainTxt);
const freq={};ss.join(' ').toLowerCase().match(/[a-z\u00c0-\u024f\u0370-\u03ff\u0400-\u04ff\u0600-\u06ff\w]+/g).forEach(w=>{freq[w]=(freq[w]||0)+1;});
const scored=ss.map(s=>{let sc=0;(s.toLowerCase().match(/[a-z\u00c0-\u024f\u0370-\u03ff\u0400-\u04ff\u0600-\u06ff\w]+/g)||[]).forEach(w=>{sc+=freq[w]||0;});return {s,sc};}).sort((a,b)=>b.sc-a.sc);
const top=scored.slice(0,3).map(x=>x.s);
if(top.length){snap();doc().blocks.push({id:uid(),type:'text',html:'<p><b>'+t('sumL')+':</b> '+esc(top.join(' '))+'</p>'});html+=`📝 ${t('sumL')}<br>`;done=true;}
}
if(needRep&&sheets.length){
const s=sheets[0];let tot=0,n=0,mx=-Infinity,mn=Infinity;
Object.keys(s.data).forEach(k=>{const c=s.data[k];if(c&&(typeof c.v==='number')){tot+=c.v;n++;if(c.v>mx)mx=c.v;if(c.v<mn)mn=c.v;}});
if(n){snap();const avg=tot/n;
doc().blocks.push({id:uid(),type:'text',html:'<p><b>'+t('insL')+':</b> n='+n+', sum='+Math.round(tot*100)/100+', avg='+Math.round(avg*100)/100+', range=['+mn+'…'+mx+'].</p>'});html+=`📈 ${t('insL')}<br>`;done=true;}
}
if(needChart){
const s=sheets[0];
if(!s){html+=t('noSheets');}
else{snap();const nb={id:uid(),type:'chart',src:s.id,range:'A1:B5',ctype:'bar'};doc().blocks.push(nb);html+=`📈 chart ← ${s.name}<br>`;done=true;}
}
if(!done)html=t('understoodL');
box.innerHTML=html;renderAll();save();
}

function pNext(e){if(e)e.stopPropagation();const arr=slidesArr();if(PI<arr.length-1){PI++;showP();}}
